test_duration: 1200
round_robin: true

prepare_write_cmd: [ "cassandra-stress write cl=ALL n=150000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native  -rate threads=650 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..150000000",
                     "cassandra-stress write cl=ALL n=150000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native  -rate threads=650 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=150000001..300000000",
                     "cassandra-stress write cl=ALL n=150000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native  -rate threads=650 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=300000001..450000000",
                     "cassandra-stress write cl=ALL n=150000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native  -rate threads=650 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=450000001..600000000" ]

stress_cmd_m: "cassandra-stress mixed cl=QUORUM duration=360m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=180 -col 'size=FIXED(1024) n=FIXED(1)' -pop 'dist=gauss(1..600000000,300000000,90000000)'"

instance_type_db: 'i4i.8xlarge'
instance_type_loader: 'c6i.8xlarge'
n_db_nodes: 6
n_loaders: 4
