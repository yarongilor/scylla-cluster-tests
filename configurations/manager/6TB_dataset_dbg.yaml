test_duration: 1200
round_robin: true

prepare_write_cmd: [
  "cassandra-stress write cl=ALL n=10000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=650 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..10000000",
  "cassandra-stress write cl=ALL n=10000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=650 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=10000001..20000000",
  "cassandra-stress write cl=ALL n=10000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=650 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=20000001..30000000",
  "cassandra-stress write cl=ALL n=10000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=650 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=30000001..40000000"
]

stress_cmd: [
  "cassandra-stress write cl=QUORUM duration=20m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=370 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..20000000",
  "cassandra-stress write cl=QUORUM duration=20m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=370 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=20000001..40000000"
]

stress_read_cmd: [
  "cassandra-stress read cl=QUORUM duration=20m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=370 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..20000000",
  "cassandra-stress read cl=QUORUM duration=20m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=370 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=20000001..40000000"
]

instance_type_db: 'i4i.8xlarge'
instance_type_loader: 'c6i.8xlarge'
n_db_nodes: 6
n_loaders: 4
n_monitor_nodes: 1
region_name: us-east-1
backup_bucket_location: 'manager-backup-tests-us-east-1'
append_scylla_yaml:
  auto_snapshot: false
  object_storage_endpoints:
    - name: s3.us-east-1.amazonaws.com
      port: 443
      https: true
      aws_region: us-east-1
aws_instance_profile_name_db: 'qa-scylla-manager-backup-instance-profile'
user_prefix: 'manager-native-backup-benchmark'
use_hdrhistogram: true
