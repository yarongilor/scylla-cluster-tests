test_duration: 1200
round_robin: true

prepare_write_cmd: [
  "cassandra-stress write cl=ALL n=53687091 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=650 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..53687091",
  "cassandra-stress write cl=ALL n=53687091 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=650 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=53687092..107374182",
  "cassandra-stress write cl=ALL n=53687091 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=650 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=107374183..161061273",
  "cassandra-stress write cl=ALL n=53687091 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=650 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=161061274..214748364"
]

stress_cmd_m: "cassandra-stress mixed cl=QUORUM duration=360m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=550 -col 'size=FIXED(1024) n=FIXED(1)' -pop 'dist=gauss(1..214748364,107142857,32142857)'"

instance_type_db: 'i4i.8xlarge'
instance_type_loader: 'c6i.8xlarge'
n_db_nodes: 6
n_loaders: 4
