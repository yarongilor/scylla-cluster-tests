test_metadata:
  description: >-
    Automatic Repair MS2 migration from scylla.yaml to CQL cluster config. The base release runs auto repair
    from the deprecated scylla.yaml options, every node is upgraded, the same values are set with ALTER
    CLUSTER, and the yaml options are removed from every node with a rolling restart. Each phase lasts one
    repair period; no stress and no other cluster operations. Auto repair continuity is checked offline from
    the "Finished tablet repair ... request_type=auto_repair" DB log lines.
  test_type: upgrade
  tier: ondemand
  duration_class: short
  supported_backends:
    - aws
  stress_tools: []
  nemesis_labels: []
  features:
    - tablets
  team_ownership: storage-qa

# Maintained by Storage QA
# Scenario "Migration of auto repair settings from scylla.yaml to cluster config" of the Automatic Repair MS2
# test plan (https://scylladb.atlassian.net/wiki/x/CwBlHg), without stress and without adding a node.
# The base version comes from the job (base_versions), the upgrade target from new_scylla_repo.
test_duration: 120

n_db_nodes: 3
n_loaders: 0
sizing_db:
  vcpu: 2
  memory: '>=16'

user_prefix: 'upgrade-auto-repair-yaml-migration'

# Auto repair of the base release, from the deprecated scylla.yaml options. The test sets the same values with
# ALTER CLUSTER after the upgrade, and waits one repair period in each phase
append_scylla_yaml:
  auto_repair_enabled_default: true
  auto_repair_threshold_default_in_seconds: 600

# A never-repaired tablet is eligible for auto repair right away
pre_create_keyspace:
  - "CREATE KEYSPACE ks_auto WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 3} AND tablets = {'enabled': true}"
  - "CREATE TABLE ks_auto.t (pk bigint, ck bigint, PRIMARY KEY (pk, ck))"
  - "INSERT INTO ks_auto.t (pk, ck) VALUES (1, 1)"
