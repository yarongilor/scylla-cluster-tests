test_metadata:
  description: >-
    Automatic Repair MS2 migration from scylla.yaml to CQL cluster config. The base release runs auto repair
    from the deprecated scylla.yaml options, every node is upgraded, the same values are set with ALTER
    CLUSTER, and the yaml options are removed from every node with a rolling restart. Each phase lasts one
    repair period, under a small latte load that inserts, deletes and validates reads; no other cluster
    operations. Auto repair continuity is checked offline from the
    "Finished tablet repair ... request_type=auto_repair" DB log lines.
  test_type: upgrade
  tier: ondemand
  duration_class: short
  supported_backends:
    - aws
  stress_tools:
    - latte
  workload: mixed
  nemesis_labels: []
  features:
    - tablets
  team_ownership: storage-qa

# Maintained by Storage QA
# Scenario "Migration of auto repair settings from scylla.yaml to cluster config" of the Automatic Repair MS2
# test plan (https://scylladb.atlassian.net/wiki/x/CwBlHg), with a small load and without adding a node.
# The base version comes from the job (base_versions), the upgrade target from new_scylla_repo.
test_duration: 120

n_db_nodes: 3
n_loaders: 1
sizing_db:
  vcpu: 2
  memory: '>=16'

user_prefix: 'upgrade-auto-repair-yaml-migration'

# Auto repair of the base release, from the deprecated scylla.yaml options. The test sets the same values with
# ALTER CLUSTER after the upgrade, and waits one repair period in each phase
append_scylla_yaml:
  auto_repair_enabled_default: true
  auto_repair_threshold_default_in_seconds: 600

# A never-repaired tablet is eligible for auto repair right away
pre_create_keyspace:
  - "CREATE KEYSPACE ks_auto WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 3} AND tablets = {'enabled': true}"
  - "CREATE TABLE ks_auto.t (pk bigint, ck bigint, PRIMARY KEY (pk, ck))"

# 'latte schema' runs once per script: point it at the existing table, so it creates nothing
latte_schema_parameters:
  keyspace: 'ks_auto'
  table: 't'

# 200K keys: keys 160001-200000 (20%) are deleted, the rest inserted, and reads validate both.
# The upgrade test doesn't render stress_template_context, so the latte arguments are spelled out
stress_before_upgrade: >-
  latte run --tag prepare-ks-auto-t -f insert_or_delete --consistency=ALL -d 200000
  -P row_count=200000 -P delete_start_index=160001 -P delete_end_index=200000 --threads=2 --concurrency=32
  -P keyspace=\"ks_auto\" -P table=\"t\" data_dir/latte/validation.rn

# Covers the 4 repair periods, the upgrade and the restarts; the test waits for it at the end
stress_during_entire_upgrade: >-
  latte run --tag ks-auto-t -f insert_or_delete:1 -f get:1 --consistency=QUORUM --duration=65m --rate=500
  --retry-number=10 --retry-interval=500ms,5s --request-timeout=30s --validation-strategy=retry
  -P row_count=200000 -P delete_start_index=160001 -P delete_end_index=200000 --threads=2 --concurrency=32
  -P keyspace=\"ks_auto\" -P table=\"t\" data_dir/latte/validation.rn
