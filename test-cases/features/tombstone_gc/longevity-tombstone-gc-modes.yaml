test_duration: 60

stress_cmd: ["scylla-bench -workload=timeseries -mode=write -replication-factor=3 -partition-count=20 -clustering-row-count=2 -clustering-row-size=10 -concurrency=10 -rows-per-request=1 -start-timestamp=SET_WRITE_TIMESTAMP -connection-count 10 -max-rate 30000 -timeout=120s -retry-number=30 -retry-interval=80ms,1s -duration=3m"]

n_db_nodes: 3
n_loaders: 1
n_monitor_nodes: 1

instance_type_db: 'i4i.large'


user_prefix: 'longevity-tombstone-gc-modes'

# Table settings:
# gc_grace_seconds: 4 minutes
# TTL: 4 minutes
# TWCS time window size: 4 minutes
# propagation-delay: 4 minutes
post_prepare_cql_cmds: "ALTER TABLE scylla_bench.test with gc_grace_seconds = 60 and default_time_to_live = 60 and compaction = {'class':'TimeWindowCompactionStrategy', 'compaction_window_size': 2, 'compaction_window_unit': 'MINUTES'} and tombstone_gc = {'mode': 'disabled', 'propagation_delay_in_seconds':'60'};"
