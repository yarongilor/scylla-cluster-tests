test_duration: 2400
n_db_nodes: 6
n_test_oracle_db_nodes: 1
n_loaders: 1
n_monitor_nodes: 1
instance_type_db: 'i4i.xlarge'
instance_type_loader: 'm6i.2xlarge'

user_prefix: 'gemini-tombstones-sequence'
nemesis_class_name: 'NemesisGeminiSequence'
nemesis_interval: 5
nemesis_seed: '025'
gemini_seed: 55
gemini_cmd: |
  --duration 24h
  --warmup 10m
  --concurrency 200
  --mode mixed
  --max-mutation-retries-backoff 10s
  --max-mutation-retries 30
  --token-range-slices 10000
  --max-errors-to-store 1

gemini_log_cql_statements: true
db_type: mixed_scylla
instance_type_db_oracle: 'i4i.8xlarge'

append_scylla_yaml:
  commitlog_sync: 'batch'
