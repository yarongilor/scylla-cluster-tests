test_duration: 2400
n_db_nodes: 6
n_test_oracle_db_nodes: 1
n_loaders: 1
n_monitor_nodes: 1
instance_type_db: 'i4i.xlarge'
#instance_type_loader: 'm6i.xlarge'
instance_type_loader: 'm6i.2xlarge'

user_prefix: 'gemini-tombstones-longrun'
nemesis_class_name: 'SisyphusMonkey'
nemesis_interval: 5
nemesis_seed: '027'
gemini_seed: 55
gemini_cmd: |
  --duration 24h
  --warmup 10m
  --concurrency 200
  --mode mixed
  --max-mutation-retries-backoff 10s
  --max-mutation-retries 30
  --token-range-slices 10000
  --statement-ratios '{"mutation":{"insert":0.5,"update":0.2,"delete":0.3}}'
  --max-errors-to-store 1

gemini_schema_url: 'https://s3.amazonaws.com/scylla-gemini/Binaries/schema.json' # currently is not used
gemini_log_cql_statements: true
#gemini_table_options:
#  - "gc_grace_seconds=60 "
db_type: mixed_scylla
instance_type_db_oracle: 'i4i.8xlarge'

append_scylla_yaml:
  commitlog_sync: 'periodic'
  commitlog_sync_period_in_ms: 50
