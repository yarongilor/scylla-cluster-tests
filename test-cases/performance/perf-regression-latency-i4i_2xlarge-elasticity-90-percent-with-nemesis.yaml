# stress_cmd: "cassandra-stress mixed no-warmup cl=ONE duration=800m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate 'threads=300 fixed=4218/s' -col 'size=FIXED(128) n=FIXED(8)' -pop 'dist=gauss(1..162500000,81250000,1625000)'"
stress_cmd:
  - "cassandra-stress read no-warmup cl=QUORUM duration=240m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate 'threads=2 fixed=3000/s' -col 'size=FIXED(128) n=FIXED(8)' -pop 'dist=gauss(1..162500000,81250000,1625000)'"
  - "cassandra-stress write no-warmup cl=ONE duration=240m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate 'threads=1 fixed=10/s' -col 'size=FIXED(128) n=FIXED(8)' -pop 'dist=gauss(1..162500000,81250000,102500)'"

stop_test_on_stress_failure: false
pre_create_keyspace: "CREATE KEYSPACE IF NOT EXISTS keyspace1 WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 3} AND tablets = {'initial': 64};"

n_db_nodes: 3
nemesis_add_node_cnt: 3
n_loaders: 1
n_monitor_nodes: 1
nemesis_grow_shrink_instance_type: 'i4i.large'

instance_type_db: 'i3.large'

nemesis_class_name: 'SlaReplaceUsingDetachDuringLoad'
nemesis_interval: 5
nemesis_during_prepare: true

user_prefix: 'elasticity-test-nemesis'
space_node_threshold: 644
ami_id_db_scylla_desc: 'VERSION_DESC'
round_robin: true
append_scylla_args: '--blocked-reactor-notify-ms 5 --abort-on-lsa-bad-alloc 1 --abort-on-seastar-bad-alloc --abort-on-internal-error 1 --abort-on-ebadf 1'
backtrace_decoding: false
print_kernel_callstack: true

store_perf_results: true
email_recipients: ["yarongilor@scylladb.com"]
# use_prepared_loaders: true
use_hdr_cs_histogram: true
email_subject_postfix: 'elasticity test disruptive nemesis'
nemesis_double_load_during_grow_shrink_duration: 0
parallel_node_operations: false

sla: true
server_encrypt: true
client_encrypt: true

stress_image:
  cassandra-stress: 'scylladb/cassandra-stress:3.17.0'
