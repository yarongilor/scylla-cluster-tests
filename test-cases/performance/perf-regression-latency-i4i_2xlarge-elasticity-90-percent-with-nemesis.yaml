prepare_write_cmd:
  - "cassandra-stress write no-warmup cl=ALL n=7812 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=2 -col 'size=FIXED(128) n=FIXED(8)' -pop seq=1..7812"
  - "cassandra-stress write no-warmup cl=ALL n=7812 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=2 -col 'size=FIXED(128) n=FIXED(8)' -pop seq=78125001..156250000"
  - "cassandra-stress write no-warmup cl=ALL n=7812 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=2 -col 'size=FIXED(128) n=FIXED(8)' -pop seq=156250001..234375000"
  - "cassandra-stress write no-warmup cl=ALL n=7812 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=2 -col 'size=FIXED(128) n=FIXED(8)' -pop seq=234375001..312500000"

