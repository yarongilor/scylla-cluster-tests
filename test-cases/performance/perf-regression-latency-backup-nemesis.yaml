
test_duration: 200

prepare_write_cmd: [ "cassandra-stress write cl=QUORUM n=15000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native  -rate threads=5 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..15000"]

stress_cmd_m: "cassandra-stress mixed cl=QUORUM duration=15m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native  -rate threads=5 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..15000"


instance_type_db: 'i3.large'
n_db_nodes: 3
n_loaders: 1
n_monitor_nodes: 1
region_name: us-east-1

backup_bucket_location: 'manager-backup-tests-us-east-1'
append_scylla_yaml:
  auto_snapshot: false
  object_storage_endpoints:
    - name: s3.us-east-1.amazonaws.com
      port: 443
      https: true
      aws_region: us-east-1
aws_instance_profile_name_db: 'qa-scylla-manager-backup-instance-profile'
user_prefix: 'manager-backup-benchmark'
use_hdrhistogram: true

ami_id_db_scylla_desc: 'VERSION_DESC'
nemesis_class_name: 'ManagerNativeBackup'

round_robin: true
append_scylla_args: '--blocked-reactor-notify-ms 5 --abort-on-lsa-bad-alloc 1 --abort-on-seastar-bad-alloc --abort-on-internal-error 1 --abort-on-ebadf 1'
backtrace_decoding: false

store_perf_results: false
email_recipients: ["yarongilor@scylladb.com"]
use_prepared_loaders: false
use_placement_group: true
use_capacity_reservation: true
email_subject_postfix: 'latency during Scylla-Manager Backup'
cluster_health_check: false
stress_image:
  cassandra-stress: 'scylladb/cassandra-stress:3.17.5'
hinted_handoff: 'enabled'
workload_name: 'mixed'
