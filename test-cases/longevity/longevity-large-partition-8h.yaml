test_duration: 600

prepare_write_cmd:  ["scylla-bench -workload=sequential -mode=write -replication-factor=3 -partition-count=100 -clustering-row-count=11 -clustering-row-size=uniform:1024..2048 -concurrency=2 -connection-count=2 -consistency-level=quorum -rows-per-request=10 -timeout=30s -validate-data" ]

stress_cmd: ["scylla-bench -workload=sequential -mode=write -replication-factor=3 -partition-count=300 -clustering-row-count=22 -clustering-row-size=uniform:10..1024     -concurrency=3  -connection-count=3  -consistency-level=quorum -rows-per-request=10 -timeout=30s -retry-number=30 -retry-interval=80ms,1s -iterations 0 -duration=4m"]
# Create MV + Set tombstone_gc to 'repair' + a propagation_delay_in_seconds of 5 minutes for the tombstone-gc-verification table:
post_prepare_cql_cmds: [
                        "CREATE MATERIALIZED VIEW scylla_bench.view_test AS SELECT * FROM scylla_bench.test where ck IS NOT NULL AND v is not null PRIMARY KEY (v, pk, ck) with comment = 'TEST VIEW'",
                        "ALTER TABLE scylla_bench.test with tombstone_gc = {'mode': 'repair', 'propagation_delay_in_seconds':'30'};"
                        ]
n_db_nodes: 3
n_loaders: 1
n_monitor_nodes: 1

round_robin: true

instance_type_db: 'i3.large'
azure_instance_type_db: 'Standard_L8s_v3'
gce_instance_type_db: 'n2-highmem-8'
gce_n_local_ssd_disk_db: 8

nemesis_class_name: 'NoOpMonkey'
nemesis_seed: '015'
nemesis_interval: 15
nemesis_during_prepare: false

user_prefix: 'test-tombstone-gc-thread'

use_preinstalled_scylla: true
# To validate rows in partitions: collect data about partitions and their rows amount
# before and after running nemesis and compare it
data_validation: |
  validate_partitions: true
  table_name: "scylla_bench.test"
  primary_key_column: "pk"
  max_partitions_in_test_table: 300
  partition_range_with_data_validation: 0-5
# Run a verification every 1 minutes:
run_tombstone_gc_verification: '{"ks_cf": "scylla_bench.test", "interval": 60, "propagation_delay_in_seconds": 30}'
pre_create_keyspace: "CREATE KEYSPACE IF NOT EXISTS scylla_bench WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 3};"
