# Reproducer for https://scylladb.atlassian.net/browse/CUSTOMER-750
#
# A 3-node tablets cluster (one node per rack, all racks in one AZ, like the Cloud "virtual racks")
# holding billions of tiny rows in three IncrementalCompactionStrategy tables. A repair-based node
# replacement (tablet 'rebuild_v2') took ~39 hours for ~3 TB per node: each tablet is fully repaired
# between the two surviving replicas at ~20-35 MiB/s (small-row overhead dominates), with only one
# rebuild per shard in flight.
#
# The test:
#   1. creates the customer schema and populates it with the customer's row shape via latte
#      ('scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn'),
#   2. runs a light mixed load (point reads, upserts, list<uuid> appends) for the whole run, plus a
#      low-rate deletion stream (event rows, whole devices, list rewrites) so the repaired data
#      carries row, partition and collection tombstones,
#   3. loops 'MgmtRepair' then 'GracefulStopTerminateAndReplaceMonkey': a manager repair (the
#      customer's daily tablet repair) marks the tombstones repaired and GC-able; then stop Scylla
#      cleanly, terminate the instance, leave the cluster one node short for a while (the customer's
#      gap was 2h40m; during it each survivor purges the repaired tombstones at its own compaction
#      pace), then replace by host id. The rebuild's full repair then has replica differences to stream.
#      Every other replace first major-compacts one surviving replica, so that replica has purged
#      all its repaired tombstones while the other still holds them (ticket comment by Botond
#      Denes, 2026-10-12: does that raise the number of repair slow paths during the rebuild?).
#
# The tombstone angle (ticket comment by Botond Denes, 2026-10-12): with tombstone_gc mode 'repair'
# the replicas drift apart as each purges repaired tombstones on its own schedule, and repair
# re-streams the collectible tombstones to replicas that already dropped them. That would explain
# the ~1% differing rows per tablet the rebuild's full repair reported one day after an incremental
# repair had found only a few thousand. 'enable_tombstone_gc_for_streaming_and_repair: true' (default
# false) is the suggested fix; it stays off here and is the knob for the comparison run.
#
# What to compare with the customer (survivor node logs, 'repair - repair[...]: stats:' lines):
#   row_from_disk_bytes_per_sec per tablet (customer: ~22-34 MiB/s), per-tablet duration
#   (customer: 17-57 min median by table) and the overall replace time.
#
# Scale: sized for a fast reproduction of the tombstone-drift mechanism, not of the 39-hour rebuild.
# The prepare writes 21M devices (105M rows, ~12 GB per node) in ~20 minutes at ~2/3 of the cluster's
# ingest capacity. The stress phase then keeps growing the dataset (three insert streams on fresh
# device ranges, ~15k rows/s, ~160 GB per node after a day) while the mixed load, the deletion
# stream and the repair/replace loop run for 24 hours, so the cycle repeats ~20 times and the
# rebuilds get longer as the data grows. The nemesis loop starts with the prepare, so the first
# repair and replace do not wait for the populate to finish. The schema's tombstone_gc propagation delay is
# lowered to 5 minutes (customer: 1 hour) so tombstones written during the run become collectible
# within the same cycle. 'device_count' and the per-loader slices scale everything; the previous
# revision but one of this file holds the customer-scale variant (540M devices, 6h prepare).

test_metadata:
  description: >-
    Customer-profile reproducer for CUSTOMER-750: a 3-node, 3-rack tablets cluster on i8ge.2xlarge
    is populated by latte with the customer's attribution schema (three ICS tables, Zstd 4 KiB
    chunks, tiny rows, growing list<uuid> cells), then MgmtRepair and GracefulStopTerminateAndReplaceMonkey
    alternate under a mixed load, a dataset-growing insert stream and a deletion stream, to check how
    many tombstone-GC replica differences the rebuild repair finds and how long the rebuilds take.
  test_type: longevity
  tier: ondemand
  duration_class: long
  supported_backends:
    - aws
  stress_tools:
    - latte
  workload: mixed
  features:
    - tablets
    - rack-aware
    - authorization
    - tls-ssl
    - kms
    - large-collections
    - sla
    - tombstone-gc
  team_ownership: core-test-infra

test_duration: 1500  # ~20m prepare + 24h stress + spare for the last replace to finish
prepare_stress_duration: 30
stress_duration: 1440

n_db_nodes: 3
n_loaders: 3
# Three racks inside a single AZ, one node per rack - the Cloud "virtual rack" layout of the customer.
simulated_racks: 3
rack_aware_loader: false

sizing_db:  # i8ge.2xlarge: 8 vCPU (7 shards), 64 GB, 2x2.5 TB local NVMe, arm64 - the customer's instance
  vcpu: 8
  memory: '>=64'
  local_disk_gb: '>=4000'
sizing_loader:
  vcpu: 8
  memory: '>=16'

user_prefix: 'long-custom-s1-replace-loop'
use_preinstalled_scylla: true
# Every replace creates a fresh i8ge.2xlarge; spot capacity for it is not reliable (a replace failed
# with 'capacity-not-available'), and a day-long loop cannot afford a missing replacement.
instance_provision: 'on_demand'
# Hold the capacity for the whole run: SCT reserves n_db_nodes + nemesis_add_node_cnt instances of the
# DB type (plus the loaders) in an AZ that has them, tries the other AZs of the region when the
# configured one is out, and every replace draws its node from that reservation. The one spare is
# all a replace needs: the old instance is terminated before the new one is requested.
use_capacity_reservation: true
nemesis_add_node_cnt: 1

# --- Scylla configuration mirroring the customer's scylla.yaml -------------------------------
# Encryption at rest with KMS stays on (the default for enterprise runs on AWS); the customer has
# user_info_encryption/system_info_encryption with a KMS key.
client_encrypt: true
server_encrypt: false
hinted_handoff: 'disabled'
internode_compression: 'rack'
append_scylla_yaml:
  internode_compression_enable_advanced: true
  rpc_dict_training_when: 'when_leader'
  tablets_mode_for_new_keyspaces: 'enforced'
  enable_repair_based_node_ops: true
  allowed_repair_based_node_ops: 'replace,removenode,rebuild'
  rf_rack_valid_keyspaces: false
  enforce_rack_list: true
  auto_snapshot: false
  commitlog_segment_size_in_mb: 32
  column_index_size_in_kb: 1
  # Siren sets this to 75% of the instance network baseline; customer value for i8ge.2xlarge.
  maintenance_io_throughput_mb_per_sec: 751
  # Customer defaults (2 each). Raising both to 4 on all nodes is the mitigation suggested in the
  # ticket; keep the defaults for the reproduction run and bump them for the comparison run.
  # tablet_streaming_read_concurrency_per_shard: 2
  # tablet_streaming_write_concurrency_per_shard: 2
  # Customer default (false): repaired tombstones are purged per replica and re-streamed by the next
  # repair. Set to true for the comparison run (the fix suggested in the ticket).
  # enable_tombstone_gc_for_streaming_and_repair: false

# --- Nemesis: manager repair, then graceful stop, dead period, replace - in a loop -------------
# The customer runs a daily manager tablet repair; with tombstone_gc mode 'repair' that is what
# makes tombstones eligible for GC on each replica. The customer's node then sent a gossip shutdown
# message (clean Scylla stop), the instance went away, and the Cloud "replace dead node" workflow
# started the replacement by host id ~2h40m later. FixedOrderMonkey runs the two nemeses in that
# order and repeats, with 'nemesis_interval' minutes between them. Manager is installed by default
# ('use_mgmt: true'); MgmtRepair repairs the whole cluster through it.
nemesis_class_name: 'FixedOrderMonkey'
nemesis_selector: 'MgmtRepair, GracefulStopTerminateAndReplaceMonkey'
nemesis_interval: 10
# Customer gap: 9600 (2h40m). Ten minutes under ~25k writes/s gives the survivors a few flushes
# and small-tier ICS compactions to purge repaired tombstones at different paces; raise it if the
# rebuild repair keeps finding no differences.
nemesis_dead_node_delay: 600
# Every 2nd replace (the 1st, 3rd, ...) runs 'nodetool compact' on one surviving replica before the
# target is stopped, so the replicas differ by every repaired tombstone that replica has purged. The
# cycles without it are the control: compare their rebuild repair stats (differing rows, slow-path
# rounds) with the compacted ones. 0 disables it.
nemesis_replace_major_compact_every: 2
# The scenario starts right away: the first repair lands inside the ~20 minute populate.
nemesis_during_prepare: true
nemesis_filter_seeds: false
# The replace waits in 'wait_for_init' for up to MAX_TIME_WAIT_FOR_NEW_NODE_UP (8h). The adaptive
# tablet-migration timeout is derived from disk size; stretch it so a slow rebuild raises soft/hard
# timeout events (visible in Argus) instead of being killed before the rebuild finishes.
adaptive_timeout_multipliers:
  tablet_migration: 4

# --- Workload --------------------------------------------------------------------------------
# 'latte schema' runs once before the first command and creates the keyspace, the three tables and
# the 'driver' service level (200 shares, workload_type 'batch', attached to the latte login role,
# which is why the auth overlay is part of the pipeline's test_config).
latte_schema_parameters:
  replication_factor: 3
  tablets: true
  # Customer: 3600. With a 3-hour run, tombstones must become collectible within one cycle.
  tombstone_gc_propagation_delay: 300

round_robin: true
# Populate (~20 min): 21M devices = 105M rows (~12 GB per node). Every command covers one third of
# the device range for one table (-P offset + -d); device_event gets EVENTS_PER_DEVICE(3) cycles per
# device, hence 3x the cycles. With round_robin the commands spread over the three loaders. The rates
# sum to ~90k inserts/s, about 2/3 of what the three nodes sustain, so the prepare neither runs the
# cluster at 100% nor leaves a large compaction backlog behind. The last command deletes at the
# steady-state rate so the first repair already finds collectible tombstones.
prepare_write_cmd:
  - >-
    latte run --tag latte-prepare-app-1 -f device_app__insert -d 7000000
    --threads 8 --connections 3 --concurrency 128 --rate 6000 --request-timeout 60 --retry-interval '2s,10s' --sampling 5s
    -P offset=0 -P device_count=21000000
    scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn
  - >-
    latte run --tag latte-prepare-attr-1 -f device_attribution__insert -d 7000000
    --threads 8 --connections 3 --concurrency 128 --rate 6000 --request-timeout 60 --retry-interval '2s,10s' --sampling 5s
    -P offset=0 -P device_count=21000000
    scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn
  - >-
    latte run --tag latte-prepare-event-1 -f device_event__insert -d 21000000
    --threads 8 --connections 3 --concurrency 128 --rate 18000 --request-timeout 60 --retry-interval '2s,10s' --sampling 5s
    -P offset=0 -P device_count=21000000
    scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn
  - >-
    latte run --tag latte-prepare-app-2 -f device_app__insert -d 7000000
    --threads 8 --connections 3 --concurrency 128 --rate 6000 --request-timeout 60 --retry-interval '2s,10s' --sampling 5s
    -P offset=7000000 -P device_count=21000000
    scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn
  - >-
    latte run --tag latte-prepare-attr-2 -f device_attribution__insert -d 7000000
    --threads 8 --connections 3 --concurrency 128 --rate 6000 --request-timeout 60 --retry-interval '2s,10s' --sampling 5s
    -P offset=7000000 -P device_count=21000000
    scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn
  - >-
    latte run --tag latte-prepare-event-2 -f device_event__insert -d 21000000
    --threads 8 --connections 3 --concurrency 128 --rate 18000 --request-timeout 60 --retry-interval '2s,10s' --sampling 5s
    -P offset=7000000 -P device_count=21000000
    scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn
  - >-
    latte run --tag latte-prepare-app-3 -f device_app__insert -d 7000000
    --threads 8 --connections 3 --concurrency 128 --rate 6000 --request-timeout 60 --retry-interval '2s,10s' --sampling 5s
    -P offset=14000000 -P device_count=21000000
    scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn
  - >-
    latte run --tag latte-prepare-attr-3 -f device_attribution__insert -d 7000000
    --threads 8 --connections 3 --concurrency 128 --rate 6000 --request-timeout 60 --retry-interval '2s,10s' --sampling 5s
    -P offset=14000000 -P device_count=21000000
    scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn
  - >-
    latte run --tag latte-prepare-event-3 -f device_event__insert -d 21000000
    --threads 8 --connections 3 --concurrency 128 --rate 18000 --request-timeout 60 --retry-interval '2s,10s' --sampling 5s
    -P offset=14000000 -P device_count=21000000
    scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn
  - >-
    latte run --tag latte-prepare-deletes -f deletes -d 18m
    --threads 2 --connections 3 --concurrency 16 --rate 300 --request-timeout 60 --retry-interval '2s,10s' --sampling 5s
    -P device_count=21000000
    scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn

# Steady state (24h), seven commands over three loaders:
#   - 'mixed' x3 on the prepared devices: ~60% point reads, ~35% device touches (device_app update +
#     device_event upsert), ~5% re-attributions (list<uuid> append + new device_attribution row).
#     ~4k cycles/s each, ~10k writes/s in total, the customer's order of magnitude.
#   - growth x3: the populate functions on fresh device ranges (offset beyond the prepared set, one
#     range per loader), ~1k new devices/s each, so the dataset keeps growing for the whole run.
#   - 'deletes' x1: 50% single event rows, 30% whole devices (three partition tombstones), 20%
#     list<uuid> rewrites (collection tombstones). At 300 cycles/s that is ~3M tombstones an hour.
#     Deleted devices are re-created by the mixed load, so tombstones shadow live data.
stress_cmd:
  - >-
    latte run --tag latte-main-1 -f mixed -d 1440m
    --threads 8 --connections 3 --concurrency 64 --rate 4000 --request-timeout 60 --retry-interval '2s,10s' --sampling 5s
    -P device_count=21000000 -P print_applied_func_names=2
    scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn
  - >-
    latte run --tag latte-main-2 -f mixed -d 1440m
    --threads 8 --connections 3 --concurrency 64 --rate 4000 --request-timeout 60 --retry-interval '2s,10s' --sampling 5s
    -P device_count=21000000 -P print_applied_func_names=2
    scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn
  - >-
    latte run --tag latte-main-3 -f mixed -d 1440m
    --threads 8 --connections 3 --concurrency 64 --rate 4000 --request-timeout 60 --retry-interval '2s,10s' --sampling 5s
    -P device_count=21000000 -P print_applied_func_names=2
    scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn
  - >-
    latte run --tag latte-growth-1 -f device_app__insert -f device_event__insert:3
    -f device_attribution__insert -d 1440m
    --threads 4 --connections 3 --concurrency 64 --rate 5000 --request-timeout 60 --retry-interval '2s,10s' --sampling 5s
    -P offset=21000000 -P device_count=100000000
    scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn
  - >-
    latte run --tag latte-growth-2 -f device_app__insert -f device_event__insert:3
    -f device_attribution__insert -d 1440m
    --threads 4 --connections 3 --concurrency 64 --rate 5000 --request-timeout 60 --retry-interval '2s,10s' --sampling 5s
    -P offset=121000000 -P device_count=100000000
    scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn
  - >-
    latte run --tag latte-growth-3 -f device_app__insert -f device_event__insert:3
    -f device_attribution__insert -d 1440m
    --threads 4 --connections 3 --concurrency 64 --rate 5000 --request-timeout 60 --retry-interval '2s,10s' --sampling 5s
    -P offset=221000000 -P device_count=100000000
    scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn
  - >-
    latte run --tag latte-deletes -f deletes -d 1440m
    --threads 2 --connections 3 --concurrency 16 --rate 300 --request-timeout 60 --retry-interval '2s,10s' --sampling 5s
    -P device_count=21000000 -P print_applied_func_names=2
    scylla-qa-internal/custom_s1/workload1/latte/custom_s1_workload1.rn
