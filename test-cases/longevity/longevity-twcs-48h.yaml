test_duration: 300

stress_cmd: ["scylla-bench -workload=timeseries -mode=write -replication-factor=3 -partition-count=400 -clustering-row-count=100 -clustering-row-size=20 -concurrency=30 -rows-per-request=1 -start-timestamp=SET_WRITE_TIMESTAMP -connection-count 25 -max-rate 30000 -timeout=120s -retry-number=30 -retry-interval=80ms,1s -duration=180m"]
# write-rate with timeseries workload for read mode
# calculated from timeseries workload for write mode by formula:
# write-rate = -max-rate / -concurrency = 30000 / 150 = 200
stress_read_cmd: [
    "scylla-bench -workload=timeseries -mode=read -partition-count=400 -concurrency=30 -replication-factor=3 -clustering-row-count=100 -clustering-row-size=20  -rows-per-request=1 -start-timestamp=GET_WRITE_TIMESTAMP -write-rate 200 -distribution hnormal --connection-count 25 -duration=180m -timeout=30s -retry-number=30 -retry-interval=80ms,1s",
    "scylla-bench -workload=timeseries -mode=read -partition-count=400 -concurrency=30 -replication-factor=3 -clustering-row-count=100 -clustering-row-size=20  -rows-per-request=1 -start-timestamp=GET_WRITE_TIMESTAMP -write-rate 200 -distribution uniform --connection-count 25 -duration=180m -timeout=30s -retry-number=30 -retry-interval=80ms,1s"
    ]


n_db_nodes: 3
n_loaders: 1
n_monitor_nodes: 1

instance_type_db: 'i3.xlarge'

nemesis_class_name: 'EnableDisableTableEncryptionAwsKmsProviderWithoutRotationMonkey'
nemesis_during_prepare: true
nemesis_interval: 15
space_node_threshold: 64424

user_prefix: 'twcs-48h-kms-sstabledump'

post_prepare_cql_cmds: "ALTER TABLE scylla_bench.test with gc_grace_seconds = 12000 and default_time_to_live = 10800 and compaction = {'class':'TimeWindowCompactionStrategy', 'compaction_window_size': 60, 'compaction_window_unit': 'MINUTES'};"


round_robin: true
